<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Why did my bag move? Explains your crypto portfolio's 24h move: whole market, sectors and coin-specific, every number cited to a live CoinMarketCap API call.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#3861fb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3861fb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="24" fill="url(#glow)"/>

  <!-- Left: title -->
  <text x="64" y="104" class="sans" font-size="15" font-weight="700" letter-spacing="2.4" fill="#6e8bff">BUILT ON THE COINMARKETCAP API</text>
  <text x="62" y="172" class="sans" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Why did my</text>
  <text x="62" y="238" class="sans" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">bag move?</text>
  <text x="64" y="290" class="sans" font-size="19" fill="#aab3c5">Your portfolio's 24h move, split into</text>
  <text x="64" y="318" class="sans" font-size="19" fill="#aab3c5"><tspan fill="#8ea5ff" font-weight="700">market</tspan>, <tspan fill="#f5b942" font-weight="700">sector</tspan> and <tspan fill="#c792ff" font-weight="700">coin-specific</tspan> parts,</text>
  <text x="64" y="346" class="sans" font-size="19" fill="#aab3c5">with every number cited to a live API call.</text>

  <!-- Right: animated result card -->
  <g transform="translate(640 60)">
    <rect width="500" height="300" rx="18" fill="#161d30" stroke="#2a3350"/>

    <!-- live indicator -->
    <circle cx="438" cy="32" r="5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="450" y="37" class="sans" font-size="12" font-weight="700" fill="#3fb950">LIVE</text>

    <text x="28" y="40" class="sans" font-size="13" fill="#8b94a7">YOUR BAG · 24H</text>
    <text x="28" y="78" class="sans" font-size="30" font-weight="800" fill="#3fb950">+$173.91
      <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.08;0.95;1" dur="8s" repeatCount="indefinite"/>
    </text>
    <text x="178" y="78" class="sans" font-size="17" font-weight="600" fill="#3fb950" opacity="0.85">(+1.81%)</text>

    <!-- rows: label, bar track, animated bar, value, citation chip -->
    <g class="sans" font-size="14">
      <!-- Market -->
      <text x="28" y="124" fill="#c8d0e0">Whole market</text>
      <rect x="28" y="134" width="444" height="12" rx="6" fill="#222a40"/>
      <rect x="28" y="134" height="12" rx="6" fill="#6e8bff" width="0">
        <animate attributeName="width" values="0;0;380;380;0" keyTimes="0;0.1;0.25;0.92;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0.2 0.8 0.2 1;0 0 1 1;0.5 0 1 1"/>
      </rect>
      <text x="400" y="124" text-anchor="end" font-weight="700" fill="#8ea5ff">+$152.31</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.28;0.92;1" dur="8s" repeatCount="indefinite"/>
        <rect x="414" y="110" width="58" height="20" rx="6" fill="#0b1020" stroke="#3b4566"/>
        <text x="443" y="124" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#8ea5ff">E2 E5</text>
      </g>

      <!-- Sector -->
      <text x="28" y="180" fill="#c8d0e0">Sectors</text>
      <rect x="28" y="190" width="444" height="12" rx="6" fill="#222a40"/>
      <rect x="28" y="190" height="12" rx="6" fill="#f5b942" width="0">
        <animate attributeName="width" values="0;0;26;26;0" keyTimes="0;0.3;0.42;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="400" y="180" text-anchor="end" font-weight="700" fill="#f5b942">+$10.36</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.41;0.45;0.92;1" dur="8s" repeatCount="indefinite"/>
        <rect x="414" y="166" width="58" height="20" rx="6" fill="#0b1020" stroke="#3b4566"/>
        <text x="443" y="180" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#f5b942">E9</text>
      </g>

      <!-- Coin-specific -->
      <text x="28" y="236" fill="#c8d0e0">Coin-specific</text>
      <rect x="28" y="246" width="444" height="12" rx="6" fill="#222a40"/>
      <rect x="28" y="246" height="12" rx="6" fill="#c792ff" width="0">
        <animate attributeName="width" values="0;0;28;28;0" keyTimes="0;0.47;0.58;0.92;1" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="400" y="236" text-anchor="end" font-weight="700" fill="#c792ff">+$11.24</text>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.57;0.61;0.92;1" dur="8s" repeatCount="indefinite"/>
        <rect x="414" y="222" width="58" height="20" rx="6" fill="#0b1020" stroke="#3b4566"/>
        <text x="443" y="236" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#c792ff">E1</text>
      </g>
    </g>

    <text x="28" y="284" class="sans" font-size="13" fill="#8b94a7">Verdict: <tspan fill="#ffffff" font-weight="700">mostly a market-wide move</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.7;0.92;1" dur="8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Bottom strip -->
  <text x="64" y="388" class="mono" font-size="13" fill="#5f6b85">quotes · global metrics · 30-day history · categories · fear &amp; greed · liquidations · real-world assets</text>
</svg>
